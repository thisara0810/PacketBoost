name: Build PacketBoost Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Locate Android NDK
        run: |
          NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | tail -n 1)
          if [ -z "$NDK_PATH" ]; then
            echo "Installing NDK via sdkmanager..."
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
            NDK_PATH="$ANDROID_HOME/ndk/25.2.9519653"
          fi
          echo "Using NDK from: $NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Build Go Native Core (.so)
        run: |
          BRIDGE_PATH=$(find . -name "bridge.go" | head -n 1)
          MANIFEST_PATH=$(find . -name "AndroidManifest.xml" | head -n 1)
          
          if [ -z "$BRIDGE_PATH" ]; then
            echo "Error: bridge.go not found in repository!"
            exit 1
          fi
          
          CORE_DIR=$(dirname "$BRIDGE_PATH")
          MAIN_DIR=$(dirname "$MANIFEST_PATH")
          
          JNI_ARM64="$(pwd)/$MAIN_DIR/jniLibs/arm64-v8a"
          JNI_ARMV7="$(pwd)/$MAIN_DIR/jniLibs/armeabi-v7a"
          
          mkdir -p "$JNI_ARM64"
          mkdir -p "$JNI_ARMV7"
          
          cd "$CORE_DIR"
          rm -f go.mod go.sum
          go mod init packetboost/native/core
          go get github.com/xtaci/kcp-go/v5
          go get github.com/xtaci/smux
          go mod tidy

          # Build arm64-v8a
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang go build -buildmode=c-shared -o "$JNI_ARM64/libpacketboost_core.so" bridge.go
          
          # Build armeabi-v7a
          CGO_ENABLED=1 GOOS=android GOARCH=arm GOARM=7 CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi30-clang go build -buildmode=c-shared -o "$JNI_ARMV7/libpacketboost_core.so" bridge.go

      - name: Build Android Debug APK
        run: |
          SETTINGS_PATH=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -z "$SETTINGS_PATH" ]; then
            echo "Error: settings.gradle.kts not found!"
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$SETTINGS_PATH")
          cd "$PROJECT_ROOT"

          mkdir -p gradle/wrapper
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar

          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            chmod +x "$GRADLEW_PATH"
            "$GRADLEW_PATH" assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacketBoost-Android-APK
          path: "**/app-debug.apk"
