name: Build PacketBoost Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Locate Android NDK
        run: |
          NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | tail -n 1)
          if [ -z "$NDK_PATH" ]; then
            echo "Installing NDK via sdkmanager..."
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
            NDK_PATH="$ANDROID_HOME/ndk/25.2.9519653"
          fi
          echo "Using NDK from: $NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Build Go Native Core (.so)
        run: |
          cd native/core
          go mod init packetboost/native/core || true
          go get github.com/xtaci/kcp-go/v5
          go get github.com/xtaci/smux
          go get github.com/klauspost/reedsolomon
          go mod tidy

          mkdir -p ../../app/src/main/jniLibs/arm64-v8a
          mkdir -p ../../app/src/main/jniLibs/armeabi-v7a
          
          # Build arm64-v8a
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang go build -buildmode=c-shared -o ../../app/src/main/jniLibs/arm64-v8a/libpacketboost_core.so bridge.go
          
          # Build armeabi-v7a
          CGO_ENABLED=1 GOOS=android GOARCH=arm GOARM=7 CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi30-clang go build -buildmode=c-shared -o ../../app/src/main/jniLibs/armeabi-v7a/libpacketboost_core.so bridge.go

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew || true

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacketBoost-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
